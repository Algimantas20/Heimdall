[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM5
monitor_port = COM5

lib_deps =
    ICM20948_WE
    adafruit/Adafruit BMP280 Library @ ^2.1.1
    adafruit/Adafruit Unified Sensor @ ^1.1.9
